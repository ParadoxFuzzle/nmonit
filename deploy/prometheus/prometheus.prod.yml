# Prometheus configuration for the production control plane.
#
# The control plane requires an API key on /metrics. The key is supplied as a
# Docker secret at /run/secrets/nmonit_api_key and sent as a Bearer token.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nmonit-control-plane"
    scheme: https
    metrics_path: "/metrics"
    authorization:
      type: Bearer
      credentials_file: /run/secrets/nmonit_api_key
    tls_config:
      ca_file: /etc/prometheus/certs/ca.crt
      server_name: control-plane
    static_configs:
      - targets:
          - "control-plane:8080"
        labels:
          service: "control-plane"
